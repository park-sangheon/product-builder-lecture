<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls">
        <button id="theme-toggle">
            <span id="theme-icon">🌙</span>
            <span id="theme-text">Dark Mode</span>
        </button>
    </div>

    <div class="background-overlay">
        <svg id="bg-svg" xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 800'>
            <g fill='none' stroke='var(--overlay-stroke)' stroke-width='1'>
                <path d='M-200,400 l200,-400 M-100,400 l200,-400 M0,400 l200,-400 M100,400 l200,-400 M200,400 l200,-400 M300,400 l200,-400 M400,400 l200,-400 M500,400 l200,-400 M600,400 l200,-400 M700,400 l200,-400'/>
                <path d='M-200,400 l-200,400 M-100,400 l-200,400 M0,400 l-200,400 M100,400 l-200,400 M200,400 l-200,400 M300,400 l-200,400 M400,400 l-200,400 M500,400 l-200,400 M600,400 l-200,400 M700,400 l-200,400'/>
                <circle cx='400' cy='400' r='400' fill='var(--overlay-circle-fill)'/>
                <g fill='var(--overlay-dots)'>
                    <circle cx='400' cy='400' r='2'/><circle cx='100' cy='100' r='2'/><circle cx='200' cy='600' r='2'/><circle cx='700' cy='200' r='2'/><circle cx='600' cy='500' r='1'/><circle cx='50' cy='300' r='1'/><circle cx='350' cy='200' r='1'/><circle cx='650' cy='700' r='2'/><circle cx='250' cy='450' r='1'/><circle cx='750' cy='550' r='1'/>
                </g>
            </g>
        </svg>
    </div>

    <div class="container">
        <h1>Lotto Number Generator</h1>
        <button id="generate">Generate Numbers</button>
        <div id="numbers" class="numbers-container"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
